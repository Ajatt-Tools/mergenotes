name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  # Release tags must pass the same Python 3.10 checks as branch pushes.
  checks:
    uses: ./.github/workflows/ci.yml

  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    needs: checks
    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: "recursive"

      - name: "Install zipmerge"
        run: |
          sudo apt-get install -y zipmerge

      - name: "Create zip"
        run: |
          ./scripts/package.sh --target github

      - name: "Create release"
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: "Merge Notes ${{github.ref_name}}"
          files: |
            *.ankiaddon
