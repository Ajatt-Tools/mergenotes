[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling>=1.24",
  "hatch-vcs>=0.4",
]

[project]
name = "ajt-merge-notes"
dynamic = ["version"]
description = "An Anki add-on that merges selected notes."
readme = "README.md"
requires-python = "~=3.10" # Keep the minimum aligned with Anki's Python runtime.
license = { file = "LICENSE" }
keywords = ["ajatt"]
authors = [
  { name = "Ajatt-Tools and contributors" },
  { name = "Ren Tatsumoto", email = "tatsu@autistici.org" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Ajatt-Tools/mergenotes"
Issues = "https://github.com/Ajatt-Tools/mergenotes/issues"
Source = "https://github.com/Ajatt-Tools/mergenotes"

[tool.hatch.build.targets.wheel]
packages = ["merge_notes"]

[tool.hatch.version]
source = "vcs"
path = "merge_notes/__about__.py"

[tool.hatch.build.hooks.vcs]
version-file = "merge_notes/__about__.py"

[tool.hatch.envs.dev]
dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "beartype",
  "aqt>=26.9",
]
system-packages = true
python = "3.10"

# Python baseline and test matrix adapted from Ajatt-Tools/japanese.
# https://github.com/Ajatt-Tools/japanese/blob/2d5ddaf38b6e1eb0d826dd7d896071cd733acea8/pyproject.toml#L40-L53
[[tool.hatch.envs.dev.matrix]]
python = ["3.10"]

[tool.hatch.envs.dev.scripts]
# run as `hatch run dev:scriptname`
check = "mypy --install-types --non-interactive {args:merge_notes tests}"
test = "pytest"
testv = "pytest -vvv -s"
package = "bash \"$(git rev-parse --show-toplevel)/scripts/package.sh\" "

[tool.coverage.run]
source_pkgs = ["merge_notes", "tests"]
branch = true
parallel = true
omit = [
  "merge_notes/__about__.py",
]

[tool.coverage.paths]
merge_notes = ["merge_notes", "*/merge_notes"]
tests = ["tests", "*/merge_notes/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.black]
line-length = 120
target-version = ['py310']
unstable = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
# Do not collect source files or unrelated checkouts beside the add-on.
testpaths = ["tests"]

[tool.hatch.envs.hatch-test]
# https://hatch.pypa.io/latest/config/internal/testing/
# https://hatch.pypa.io/latest/tutorials/testing/overview/
dependencies = [
    "coverage[toml]",
    "beartype",
    "mypy>=1.0.0",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "aqt>=26.9",
]
system-packages = true
parallel = true
randomize = true

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10"]

# Adapted from Card Management's separate Hatch formatter and linter environments.
# https://github.com/Ajatt-Tools/learn-now-button/blob/bc9723e73666bbf48ecf4c4d51c624359989f8db/pyproject.toml#L116-L142
# https://hatch.pypa.io/latest/how-to/static-analysis/behavior/
[tool.hatch.envs.hatch-check-fmt]
# pyupgrade>=3.22 needs Python 3.11+. Keep the tool runtime separate from Anki's compatibility target.
python = "3.14"
dependencies = [
    "black>=26.10",
    "isort>=9.0",
    "pyupgrade>=3.22",
]

[tool.hatch.envs.hatch-check-fmt.scripts]
format-check = [
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" --check",
]
format-fix = [
    # run as: hatch check fmt --fix
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" ",
]

[tool.hatch.envs.hatch-check-code]
dependencies = ["flake8"]

[tool.hatch.envs.hatch-check-code.scripts]
# Keep lint scope and exceptions in .flake8 rather than duplicating them in CI.
lint-check = "flake8 {args:merge_notes tests}"
lint-fix = "lint-check"
